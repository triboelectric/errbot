---
name: Statick

on: # NOLINT
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4

      - name: Statick
        uses: sscpac/statick-action@v0.9.2
        with:
          check: false
          level: custom
          timings: true
          user_paths: statick-config
